
# Runs the safety tests (sign-in, fees, marks release, online exam timer + the unit tests) on every push.
# A red cross on GitHub means something that used to work has broken - look before you publish.
name: Safety tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: erp_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: .
        run: npm install --no-audit --no-fund
      - name: Run tests
        working-directory: .
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ci
          DB_NAME: erp_ci
        run: npm test